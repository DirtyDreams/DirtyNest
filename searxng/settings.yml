# SearXNG minimal config for DirtyNest (JSON API for F3/F4 research tool).
# Mounted at /etc/searxng in the searxng container.
#
# `use_default_settings: true` loads the image's full default config and
# merges only the overrides below — no need to replicate the whole file.
#
# IMPORTANT: change `secret_key` to a random value before exposing publicly:
#   python -c "import secrets; print(secrets.token_hex(32))"
use_default_settings: true

server:
  secret_key: "CHANGE_ME_dirtynest_searxng"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false

search:
  formats:
    - html
    - json
