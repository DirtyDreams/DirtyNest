services:
  postgres:
    image: postgres:16-alpine
    container_name: dirtynest-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dirtynest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: dirtynest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dirtynest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dirtynest -d dirtynest"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: dirtynest-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dirtynest-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dirtynest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dirtynest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: dirtynest-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    networks:
      - dirtynest-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: dirtynest-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - dirtynest-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Optional GPU acceleration (Windows/Docker Desktop: enable WSL2 GPU in
    # Docker Desktop settings, then uncomment the deploy block).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: Dockerfile.next
    container_name: dirtynest-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://dirtynest:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/dirtynest
      - NEXT_PUBLIC_SIDECAR_URL=http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      sidecar:
        condition: service_started
    networks:
      - dirtynest-network

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: dirtynest-sidecar
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dirtynest:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/dirtynest
      # In-network service URLs (compose service names; dev mode uses localhost from .env.local)
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=http://searxng:8080
      - OLLAMA_URL=http://ollama:11434
      # Telemetry prober: probe compose services by their network names
      - PROBE_HOST_POSTGRES=postgres
      - PROBE_HOST_QDRANT=qdrant
      - PROBE_HOST_REDIS=redis
      - PROBE_HOST_SEARXNG=searxng
      - PROBE_HOST_OLLAMA=ollama
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dirtynest-network

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  dirtynest-network:
    driver: bridge
